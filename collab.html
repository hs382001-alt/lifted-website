<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work With Lifted</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo-link img {
            height: 30px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #FF7E00;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .hero p {
            font-size: 1.25rem;
            color: #999999;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .form-container {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .form-container iframe {
            width: 100%;
            height: 2200px;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 5rem 1rem 2rem;
            }

            .form-container iframe {
                height: 2400px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 1rem;
            }

            .logo-link img {
                height: 25px;
            }

            .nav-links {
                gap: 0.75rem;
                font-size: 0.85rem;
            }

            .hero h1 {
                font-size: 1.75rem;
            }

            .form-container iframe {
                height: 2600px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="logo-link">
                <img src="images/logo-text.png" alt="Lifted Logo">
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/collab">Work With Us</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Work With Lifted</h1>
            <p>Interested in creating fitness content with us? Fill out the form below and we'll be in touch.</p>
        </div>

        <div class="form-container">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdupRflAe8CaZifCQ3uMv_lmY9DkNmP_SxzUd0F9j99CVxMRQ/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>
</body>
</html>
